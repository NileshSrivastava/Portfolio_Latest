<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Face Shadow & Highlights -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#glowRing)" stroke-width="4" opacity="0.6" />
  
  <!-- Main Background Backdrop -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad)" />

  <!-- Geometric accent grid/rings in background -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="100" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />

  <!-- Code symbols floating in background -->
  <text x="55" y="110" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff" opacity="0.45">&lt;/&gt;</text>
  <text x="310" y="130" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff" opacity="0.45">{ ; }</text>
  <text x="70" y="270" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" opacity="0.3">=&gt;</text>
  <text x="315" y="260" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff" opacity="0.3">#</text>

  <!-- Character Group -->
  <g id="character">
    <!-- Torso / Hoodie / Jacket -->
    <path d="M100 375 C100 300, 140 270, 200 270 C260 270, 300 300, 300 375 Z" fill="url(#jacketGrad)" />
    <!-- Inner T-shirt collar -->
    <path d="M170 270 C170 295, 230 295, 230 270 Z" fill="#3b82f6" opacity="0.8" />
    
    <!-- Neck -->
    <rect x="180" y="225" width="40" height="50" rx="10" fill="#f59e0b" />
    <path d="M180 245 L220 245 L200 265 Z" fill="#d97706" opacity="0.4" />

    <!-- Head / Face -->
    <ellipse cx="200" cy="185" rx="55" ry="65" fill="url(#skinGrad)" />

    <!-- Ears -->
    <ellipse cx="145" cy="185" rx="10" ry="16" fill="#f59e0b" />
    <ellipse cx="255" cy="185" rx="10" ry="16" fill="#f59e0b" />

    <!-- Modern Stylish Hair -->
    <path d="M142 175 C138 130, 160 100, 200 100 C240 100, 262 130, 258 175 C250 150, 235 140, 200 140 C165 140, 150 150, 142 175 Z" fill="url(#hairGrad)" />
    <!-- Hair volume puff -->
    <path d="M150 135 C150 105, 175 92, 205 92 C238 92, 255 110, 252 140 C240 120, 220 115, 195 118 C170 122, 160 125, 150 135 Z" fill="#0f172a" />

    <!-- Modern Eyeglasses -->
    <!-- Left Rim -->
    <rect x="162" y="165" width="30" height="24" rx="8" fill="none" stroke="#0f172a" stroke-width="4" />
    <!-- Right Rim -->
    <rect x="208" y="165" width="30" height="24" rx="8" fill="none" stroke="#0f172a" stroke-width="4" />
    <!-- Bridge -->
    <path d="M192 175 L208 175" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <!-- Frame sides -->
    <path d="M162 175 L145 172" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <path d="M238 175 L255 172" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <!-- Glass Reflections -->
    <path d="M167 170 L177 170" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M213 170 L223 170" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Eyes (behind glasses) -->
    <circle cx="177" cy="177" r="4" fill="#1e1b4b" />
    <circle cx="223" cy="177" r="4" fill="#1e1b4b" />

    <!-- Eyebrows -->
    <path d="M163 158 C170 154, 185 154, 190 158" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M210 158 C215 154, 230 154, 237 158" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M200 183 L197 197 L204 197" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Friendly Smile -->
    <path d="M185 212 C192 222, 208 222, 215 212" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Modern Corner Accent Badge (Tech sparkle) -->
  <circle cx="310" cy="305" r="28" fill="#10b981" />
  <circle cx="310" cy="305" r="28" fill="#10b981" filter="url(#softGlow)" opacity="0.5" />
  <!-- Checkmark or Star in badge -->
  <path d="M301 305 L307 311 L320 298" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

