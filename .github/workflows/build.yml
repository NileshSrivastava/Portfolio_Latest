
name: Build

on:
  push:
    branches:
      - master

  workflow_dispatch:

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tests
        run: bash scripts/test.sh
  build:
    runs-on: ubuntu-latest
    needss: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Verify build successfully
        run: bash scripts/check.sh
