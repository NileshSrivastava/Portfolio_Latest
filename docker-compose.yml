services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nilesh-portfolio
    image: nilesh-portfolio:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

